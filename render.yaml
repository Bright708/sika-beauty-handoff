# Render blueprint for the Sika API (Express). In Render: New > Blueprint > pick this repo.
# Secrets marked sync: false are asked for once during setup and never stored in the repo.
services:
  - type: web
    name: sika-api
    runtime: node
    # Free while testing (sleeps after 15 min idle). Before launch switch to a paid plan
    # in the Render dashboard, or change this to 0.5c-512mb.
    plan: free
    # Closest Render region to Accra. Cannot be changed after the service is created.
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: EMAILS_ENABLED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
